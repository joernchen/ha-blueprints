blueprint:
  name: Kamera-Snapshot an iOS und Android (mit Geräte-Alarm & HA-Stream Link)
  description: Sendet ein Live-Kamerabild an Mobilgeräte. Beim Antippen öffnet sich direkt der Live-Stream. Inklusive separater Alarm-Schalter pro Gerät.
  domain: automation
  input:
    trigger_sensor:
      name: Auslöser (Bewegung/Person)
      description: Der Sensor, der die Automation startet.
      selector:
        entity:
          domain: binary_sensor
    camera_entity:
      name: Kamera
      description: Die Kamera, von der das Bild geholt wird.
      selector:
        entity:
          domain: camera
          
    # --- iOS ---
    ios_device:
      name: iOS Gerät (Dropdown)
      description: Wähle dein Apple-Gerät.
      selector:
        device:
          integration: mobile_app
    enable_alarm_ios:
      name: Alarm für iOS aktivieren
      description: Sendet nachts eine "Critical Alert" (laut) an das iOS Gerät.
      default: false
      selector:
        boolean:
          
    # --- Android ---
    android_device:
      name: Android Gerät (Dropdown)
      description: Wähle dein Android-Gerät.
      selector:
        device:
          integration: mobile_app
    enable_alarm_android:
      name: Alarm für Android aktivieren
      description: Sendet nachts eine priorisierte Alarm-Push an das Android Gerät.
      default: false
      selector:
        boolean:
          
    # --- Allgemeine Einstellungen ---
    message_text:
      name: Nachrichtentext
      description: Der Text der Push-Benachrichtigung.
      default: "Wer ist da?"
      selector:
        text:
    cooldown:
      name: Cooldown (Sekunden)
      description: Zeit, die mindestens bis zur nächsten Benachrichtigung vergehen muss (Spam-Schutz).
      default: 30
      selector:
        number:
          min: 0
          max: 600
          unit_of_measurement: seconds
          
    # --- Alarm Zeitraum ---
    alarm_time_start:
      name: Alarm Zeitraum Start
      description: Ab wann soll der Alarm aktiv sein?
      default: "22:30:00"
      selector:
        time:
    alarm_time_end:
      name: Alarm Zeitraum Ende
      description: Bis wann soll der Alarm aktiv sein?
      default: "05:15:00"
      selector:
        time:

mode: single

variables:
  camera: !input camera_entity
  cooldown_time: !input cooldown
  ios_dev: !input ios_device
  android_dev: !input android_device
  alarm_on_ios: !input enable_alarm_ios
  alarm_on_android: !input enable_alarm_android

triggers:
  - trigger: state
    entity_id: !input trigger_sensor
    from: "off"
    to: "on"

conditions:
  - condition: template
    value_template: >
      {{ this.attributes.last_triggered is none or (now() - this.attributes.last_triggered).total_seconds() > cooldown_time }}

actions:
  # --- Sende an iOS ---
  - choose:
      - conditions:
          - condition: template
            value_template: "{{ ios_dev != '' and ios_dev != none }}"
          - condition: template
            value_template: "{{ alarm_on_ios }}"
          - condition: time
            after: !input alarm_time_start
            before: !input alarm_time_end
        sequence:
          - domain: mobile_app
            type: notify
            device_id: !input ios_device
            message: !input message_text
            data:
              url: "entityId:{{ camera }}"
              attachment:
                url: "/api/camera_proxy/{{ camera }}"
                content-type: jpeg
              push: null
              sound:
                name: default
                critical: 1
                volume: 0.8
                
      - conditions:
          - condition: template
            value_template: "{{ ios_dev != '' and ios_dev != none }}"
        sequence:
          - domain: mobile_app
            type: notify
            device_id: !input ios_device
            message: !input message_text
            data:
              url: "entityId:{{ camera }}"
              attachment:
                url: "/api/camera_proxy/{{ camera }}"
                content-type: jpeg

  # --- Sende an Android ---
  - choose:
      - conditions:
          - condition: template
            value_template: "{{ android_dev != '' and android_dev != none }}"
          - condition: template
            value_template: "{{ alarm_on_android }}"
          - condition: time
            after: !input alarm_time_start
            before: !input alarm_time_end
        sequence:
          - domain: mobile_app
            type: notify
            device_id: !input android_device
            message: !input message_text
            data:
              clickAction: "entityId:{{ camera }}"
              image: "/api/camera_proxy/{{ camera }}"
              ttl: 0
              priority: high
              channel: alarm_stream
              
      - conditions:
          - condition: template
            value_template: "{{ android_dev != '' and android_dev != none }}"
        sequence:
          - domain: mobile_app
            type: notify
            device_id: !input android_device
            message: !input message_text
            data:
              clickAction: "entityId:{{ camera }}"
              image: "/api/camera_proxy/{{ camera }}"
